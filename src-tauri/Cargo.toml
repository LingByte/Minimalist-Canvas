[package]
name = "minimalist-canvas"
version = "0.1.4"
description = "Minimalist Canvas - Infinite canvas desktop app"
authors = ["LingByte"]
edition = "2021"

[lib]
name = "minimalist_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-http = { version = "2.6.1", features = ["unsafe-headers"] }
tauri-plugin-fs = "2.5.2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "time", "sync"] }
tauri-plugin-process = "2.3.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12.0"
