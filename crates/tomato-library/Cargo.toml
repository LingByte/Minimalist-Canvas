[package]
name = "tomato-library"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "io-util"] }
tracing = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
