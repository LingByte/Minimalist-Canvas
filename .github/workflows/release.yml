name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            asset: Minimalist-Canvas-macOS.dmg
            find: "*/bundle/dmg/*.dmg"
          - os: windows-latest
            args: --bundles nsis
            asset: Minimalist-Canvas-Windows-x64.exe
            find: "*/bundle/nsis/*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Minimalist Canvas v__VERSION__
          releaseBody: |
            Desktop builds for macOS and Windows.

            - macOS: universal disk image (Apple Silicon and Intel). If macOS blocks the app, right-click it and choose Open. This build is not notarized.
            - Windows: 64-bit installer for Windows 10 or later.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(bun -e 'console.log(require("./src-tauri/tauri.conf.json").version)')"
          file="$(find src-tauri/target -path '${{ matrix.find }}' -type f | head -n 1)"
          test -n "$file"
          cp "$file" "${{ matrix.asset }}"
          gh release upload "v${version}" "${{ matrix.asset }}" --clobber
